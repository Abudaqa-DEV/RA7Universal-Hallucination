<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Hallucination</title>
<!-- Universal Hallucination | Ra7 DEV | Dev by: Abudaqa | https://discord.gg/Zk5CrhHYe | MIT -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="fx" aria-hidden="true"></div>
  <div id="cues" aria-hidden="true"></div>
  <div id="eye" class="hidden" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="words" aria-hidden="true"></div>
  <div id="bubbles" aria-hidden="true"></div>

  <div id="toasts" role="status" aria-live="polite"></div>

  <div id="hint" class="hidden"><kbd id="hint-key">E</kbd><span id="hint-text"></span></div>

  <section id="dialogue" class="hidden" aria-live="polite">
    <div class="dlg-speaker" id="dlg-speaker"></div>
    <p class="dlg-text" id="dlg-text"></p>
    <ul class="dlg-choices" id="dlg-choices"></ul>
    <div class="dlg-foot"><span id="dlg-hint"></span><span class="dlg-timer" id="dlg-timer"><i></i></span></div>
  </section>

  <div id="resist-prompt" class="hidden">
    <div class="rp-orb"><svg viewBox="0 0 72 72"><circle class="rp-track" cx="36" cy="36" r="31"/><circle class="rp-ring" id="rp-ring" cx="36" cy="36" r="31" pathLength="100"/></svg><kbd id="rp-key">G</kbd></div>
    <div class="rp-txt"><b id="rp-text"></b><small id="rp-sub"></small></div>
    <span class="rp-level" id="rp-level"></span>
  </div>

  <section id="resist" class="hidden">
    <div class="rs-head"><div class="rs-meta"><span class="rs-chip" id="rs-chip"></span><span id="rs-round"></span></div><span id="rs-title"></span><span class="rs-timer"><i id="rs-time"></i></span><div class="rs-hearts" id="rs-hearts"></div></div>
    <div class="rs-stage" id="rs-stage"></div>
    <div class="rs-help" id="rs-help"></div>
    <div class="rs-result" id="rs-result"></div>
  </section>

  <div id="possess" class="hidden">
    <svg viewBox="0 0 24 24" class="ps-icon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <div><b id="ps-title"></b><small id="ps-sub"></small></div>
    <span class="ps-time" id="ps-time"></span>
  </div>

  <form id="reply" class="hidden" autocomplete="off">
    <input id="reply-input" type="text" maxlength="120">
    <button type="submit" id="reply-send"></button>
  </form>

  <main id="panel" class="hidden" role="dialog" aria-modal="true"></main>
</div>
<script src="faces.js"></script>
<script src="eye.js"></script>
<script src="script.js"></script>
</body>
</html>
